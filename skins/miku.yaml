name: miku
description: Hatsune Miku - neon cyan-blue on near-black, pink accents, yellow details, white text

colors:
  # --- App surface ---
  background: "#0e0e0e"

  # --- Banner ---
  banner_border: "#00f5e0"
  banner_title: "#00f5e0"
  banner_accent: "#ff2a8e"
  banner_dim: "#fffd78"
  banner_text: "#fcfcfc"

  # --- UI roles ---
  ui_primary: "#00f5e0"
  ui_text: "#fcfcfc"
  ui_accent: "#ff2a8e"
  ui_label: "#fffd78"
  ui_border: "#00f5e0"
  ui_tool: "#ff2a8e"
  ui_thinking: "#fffd78"
  ui_ok: "#00f5e0"
  ui_warn: "#fffd78"
  ui_error: "#ff2a8e"

  # --- Prompt / response / session ---
  prompt: "#ff2a8e"
  input_rule: "#6E7A7D"
  response_border: "#00f5e0"
  session_label: "#fffd78"
  session_border: "#00f5e0"

  # --- Status bar ---
  status_bar_bg: "#0e0e0e"
  status_bar_text: "#fcfcfc"
  status_bar_strong: "#00f5e0"
  status_bar_dim: "#6E7A7D"
  status_bar_good: "#00f5e0"
  status_bar_warn: "#fffd78"
  status_bar_bad: "#ff2a8e"
  status_bar_critical: "#ff2a8e"
  voice_status_bg: "#0e0e0e"

  # --- Completion menu ---
  completion_menu_bg: "#0e0e0e"
  completion_menu_current_bg: "#ff2a8e"
  completion_menu_meta_bg: "#0e0e0e"
  completion_menu_meta_current_bg: "#ff2a8e"

  # --- Diffs ---
  diff_added: "#00f5e0"
  diff_removed: "#ff2a8e"
  diff_added_word: "#fffd78"
  diff_removed_word: "#ff2a8e"

  # --- Code syntax ---
  syntax_string: "#00f5e0"
  syntax_number: "#ff2a8e"
  syntax_keyword: "#fcfcfc"
  syntax_comment: "#b8860b"

spinner:
  thinking_faces: ["(◕‿◕)♪", "♪(´▽`)", "(｡♥‿♥｡)", "♫(◠‿◠)", "(⌒▽⌒)♪"]
  thinking_verbs:
    - "tuning the vocal synth"
    - "warming up the vocal chords"
    - "composing a melody"
    - "harmonizing"
    - "hitting the high note"
    - "twirling the leek"
    - "rehearsing on stage"
    - "syncing to the beat"
    - "mixing the track"
  waiting_faces: ["(◕ᴗ◕)♪", "♪(˘▽˘)", "(´∀`)♫"]
  wings:
    - ["⟪♪", "♪⟫"]
    - ["⟪♫", "♫⟫"]

branding:
  agent_name: "Miku Agent"
  welcome: "Miku Agent online ♪ Let's make something wonderful together!"
  goodbye: "Thanks for the session ♪ See you on the next stage!"
  response_label: " ♪ Miku "
  prompt_symbol: "♪ ❯ "
  help_header: "(♪) Available Commands"

tool_prefix: "┊"

tool_emojis:
  terminal: "🎤"
  web_search: "🎧"
  read_file: "🎼"
  write_file: "🎹"
  search_files: "🔍"

